<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Kermesse — Administration</title><link rel="stylesheet" href="admin.css"><body><main><section id="login"><h1>La Kermesse</h1><p>Administration des réservations</p><form><label>E-mail<input name="email" type="email" required></label><label>Mot de passe<input name="password" type="password" required></label><button>Se connecter</button></form><p id="login-error" role="alert"></p></section><section id="dashboard" hidden><header><h1>Réservations</h1><button id="logout">Déconnexion</button></header><p class="demo">Réglages de démonstration : à valider avant ouverture au public.</p><div class="tabs"><button data-tab="bookings">Planning</button><button data-tab="settings">Réglages</button></div><div id="bookings"><table><thead><tr><th>Date</th><th>Heure</th><th>Client</th><th>Convives</th><th>État</th><th>Contact</th></tr></thead><tbody></tbody></table></div><div id="settings" hidden><h2>Réglages</h2><form id="settings-form"><label>Mode<select name="booking_mode"><option value="MANUAL_APPROVAL">Validation manuelle</option><option value="AUTO_CONFIRM">Confirmation automatique</option></select></label><label>Durée (min)<input name="duration_minutes" type="number" min="30"></label><label>Intervalle (min)<input name="interval_minutes" type="number" min="15"></label><label>Préavis (min)<input name="lead_minutes" type="number" min="0"></label><label>Horizon (jours)<input name="max_advance_days" type="number" min="1"></label><label>Maximum convives<input name="max_party_size" type="number" min="1"></label><button>Enregistrer</button></form><h2>Tables</h2><ul id="tables"></ul></div></section></main><script src="admin.js"></script></body></html>
